name: Isolated Linux Secret Service
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated validation images
        shell: bash
        run: |
          validation_context=$(mktemp -d)
          trap 'rm -rf "$validation_context"' EXIT
          cp Cargo.toml Cargo.lock "$validation_context/"
          cp tools/linux-validation/Dockerfile "$validation_context/Dockerfile"
          docker build -t colabcli-rust-linux-validation:rust-1.85.1 "$validation_context"
          cp tools/secret-service-validation/Dockerfile "$validation_context/Dockerfile"
          docker build -t colabcli-rust-secret-service-validation:local "$validation_context"
      - name: Run with private bus and synthetic credentials
        shell: bash
        run: |
          validation_reports="$RUNNER_TEMP/native-secret-service-reports"
          mkdir -p "$validation_reports"
          validation_container=$(docker run --detach --network none --read-only --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 6g --pids-limit 512 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount type=volume,target=/validation \
            --mount type=volume,target=/opt/validation-cargo \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            colabcli-rust-secret-service-validation:local)
          trap 'docker rm -fv "$validation_container" >/dev/null 2>&1 || true' EXIT
          validation_exit=$(docker wait "$validation_container")
          docker logs "$validation_container"
          docker cp "$validation_container:/validation/reports/." "$validation_reports/"
          test "$validation_exit" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-secret-service-validation
          path: ${{ runner.temp }}/native-secret-service-reports/
          if-no-files-found: warn
          retention-days: 7
