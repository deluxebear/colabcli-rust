name: Rust foundations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --no-default-features --all-targets
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B tools/tests/test_package_release.py
      - run: python3 -B tools/tests/test_rehearse_native_update.py
      - run: python3 -B tools/tests/test_merged_help.py
      - run: python3 -B tools/tests/test_drivefs_shim.py
      - run: python3 -B tools/tests/test_drivefs_controller.py
