[package]
name = "colabcli-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-account Google Colab client in Rust"

[[bin]]
name = "colab"
path = "src/main.rs"

[features]
default = ["native-keyring"]
native-keyring = ["dep:keyring"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["windows-native"] }

[dev-dependencies]
tiny_http = "0.12"
